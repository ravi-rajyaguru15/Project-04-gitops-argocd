name: Application CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - 'gitops/manifests/deployments/app-deploy.yaml'
      - 'README.md'
      - 'images/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: legacy/app/pom.xml

      - name: Test and package application
        working-directory: legacy/app
        run: mvn -B clean verify

  publish:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: legacy/app
          file: legacy/app/Dockerfile
          push: true
          tags: ravi11rajyaguru/my-app-p4:${{ github.sha }}

      - name: Update GitOps image and push commit
        env:
          IMAGE: ravi11rajyaguru/my-app-p4:${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("gitops/manifests/deployments/app-deploy.yaml")
          manifest = path.read_text()
          pattern = re.compile(r"(?m)(^[ ]{8}- name: web-app[ \t]*\r?\n[ ]{10}image:[ \t]*).*$")
          updated, count = pattern.subn(lambda match: match.group(1) + os.environ["IMAGE"], manifest)
          if count != 1:
              raise SystemExit(f"Expected one web-app container image, found {count}")
          path.write_text(updated)
          PY

          if git diff --quiet -- gitops/manifests/deployments/app-deploy.yaml; then
            echo "GitOps image is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- gitops/manifests/deployments/app-deploy.yaml
          git commit -m "chore(gitops): update application image to ${GITHUB_SHA}"
          git push origin HEAD:main
